name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm install --legacy-peer-deps

      - name: Typecheck (backend + frontend)
        run: npm run typecheck

      - name: Build frontend (esbuild ESM modules)
        run: npm run build:frontend

      # 只部署一次：敏感 secret（ACCESS_TOKEN / D1_API_TOKEN）在 Cloudflare 面板手动维护，
      # CI 不再运行任何 wrangler secret 命令。这里仅注入非敏感构建变量并 deploy。
      - name: Deploy to Cloudflare Workers
        run: |
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          npx wrangler deploy --var "BUILD_COMMIT:${COMMIT_SHORT}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}
