name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm install --legacy-peer-deps

      - name: Typecheck (backend + frontend)
        run: npm run typecheck

      - name: Build frontend (esbuild ESM modules)
        run: npm run build:frontend

      - name: Deploy to Cloudflare Workers
        run: |
          COMMIT_SHORT="${GITHUB_SHA:0:7}"
          BUILD_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          npx wrangler deploy \
            --var "BUILD_COMMIT:${COMMIT_SHORT}" \
            --var "BUILD_TS:${BUILD_TS}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Set secrets
        run: |
          if [ -z "${{ secrets.KBOX_TOKEN }}" ]; then
            echo "::error::Please set KBOX_TOKEN secret"
            exit 1
          fi
          echo "${{ secrets.KBOX_TOKEN }}" | npx wrangler secret put ACCESS_TOKEN
          echo "${{ secrets.KBOX_TOKEN }}" | npx wrangler secret put D1_API_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
