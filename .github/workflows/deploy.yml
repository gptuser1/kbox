name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm install --legacy-peer-deps

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Set secrets
        run: |
          [ -n "${{ secrets.ACCESS_TOKEN }}" ] && echo "${{ secrets.ACCESS_TOKEN }}" | npx wrangler secret put ACCESS_TOKEN || echo "ACCESS_TOKEN not set"
          [ -n "${{ secrets.GH_TOKEN }}" ] && echo "${{ secrets.GH_TOKEN }}" | npx wrangler secret put GH_TOKEN || echo "GH_TOKEN not set"
          [ -n "${{ secrets.D1_API_TOKEN }}" ] && echo "${{ secrets.D1_API_TOKEN }}" | npx wrangler secret put D1_API_TOKEN || echo "D1_API_TOKEN not set"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
