name: Unit Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test